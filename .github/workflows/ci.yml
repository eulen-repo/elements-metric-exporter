name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    name: Lint, Test & Build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Check formatting
        run: test -z "$(gofmt -l .)" || { gofmt -l .; echo "Run 'gofmt -w .' to fix"; exit 1; }

      - name: Vet
        run: go vet ./...

      - name: Test with race detector
        run: go test -count=1 -race ./...

      - name: Build
        run: go build -ldflags='-s -w' -o elements-exporter .
